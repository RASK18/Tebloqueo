name: Windows app

on:
  pull_request:
    paths:
      - src/**
      - tests/**
      - Tebloqueo.slnx
      - .github/workflows/app.yml
  push:
    paths:
      - src/**
      - tests/**
      - Tebloqueo.slnx
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Tebloqueo.slnx

      - name: Test
        run: dotnet test Tebloqueo.slnx --configuration Release --no-restore

      - name: Determine whether to publish a release
        id: release_check
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          $shouldRelease = "${{ github.event_name }}" -eq "workflow_dispatch"

          if (-not $shouldRelease -and $env:BEFORE_SHA -match '^0+$') {
            $shouldRelease = $true
          }

          if (-not $shouldRelease) {
            $changedAppFiles = @(git diff --name-only $env:BEFORE_SHA $env:GITHUB_SHA -- src Tebloqueo.slnx)
            if ($LASTEXITCODE -ne 0) {
              throw "No se pudieron determinar los cambios de la aplicación."
            }

            $shouldRelease = $changedAppFiles.Count -gt 0
          }

          "should_release=$($shouldRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Determine next release version
        if: steps.release_check.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $releases = gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
          $patchNumbers = @(
            $releases | ForEach-Object {
              if ($_.tag_name -match '^v1\.0\.(\d+)$') {
                [int]$Matches[1]
              }
            }
          )

          $nextPatch = if ($patchNumbers.Count -eq 0) {
            1
          } else {
            ($patchNumbers | Measure-Object -Maximum).Maximum + 1
          }

          "VERSION=1.0.$nextPatch" >> $env:GITHUB_ENV

      - name: Publish single-file executable
        if: steps.release_check.outputs.should_release == 'true'
        shell: pwsh
        run: >
          dotnet publish src/Tebloqueo/Tebloqueo.csproj
          --configuration Release
          --no-restore
          --output publish
          -p:Version=$env:VERSION
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create update manifest
        if: steps.release_check.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $executable = Join-Path $PWD "publish/Tebloqueo.exe"
          $hash = (Get-FileHash $executable -Algorithm SHA256).Hash
          $manifest = @{
            version = $env:VERSION
            assetUrl = "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/Tebloqueo.exe"
            sha256 = $hash
          }
          $manifest | ConvertTo-Json | Set-Content "publish/update.json" -Encoding utf8

      - name: Create or update GitHub release
        if: steps.release_check.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          if (gh release view $tag 2>$null) {
            gh release upload $tag "publish/Tebloqueo.exe" "publish/update.json" --clobber
          } else {
            gh release create $tag "publish/Tebloqueo.exe" "publish/update.json" --title "Tebloqueo $tag" --generate-notes --latest
          }
